<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>LED Room Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
    }
    h1 {
      margin-bottom: 30px;
      font-size: 2rem;
      color: #333;
    }
    .relay-card {
      background-color: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      width: 300px;
    }
    .relay-card h2 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      color: #333;
    }
    .status {
      margin: 25px 0;
      font-size: 1.3rem;
      font-weight: bold;
    }
    .status.on {
      color: #4CAF50;
    }
    .status.off {
      color: #f44336;
    }
    .relay-card button {
      padding: 15px 40px;
      border: none;
      border-radius: 15px;
      color: white;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      width: 100%;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .relay-card button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }
    .relay-card button:active {
      transform: translateY(0);
    }
    .btn-on {
      background-color: #4CAF50;
    }
    .btn-off {
      background-color: #2196F3;
    }
    #logoutBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      font-size: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
      background-color: #555;
      transition: opacity 0.3s ease;
    }
    #logoutBtn:hover {
      opacity: 0.8;
    }
    #dashboard {
      display: none;
    }
    #loginForm {
      max-width: 400px;
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    #loginForm h2 {
      margin-bottom: 25px;
      color: #333;
    }
    #loginForm input {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0 20px;
      font-size: 1rem;
      border: 1.5px solid #ccc;
      border-radius: 10px;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }
    #loginForm input:focus {
      border-color: #1e88e5;
      outline: none;
    }
    #loginForm button {
      width: 100%;
      background-color: #1e88e5;
      color: white;
      padding: 12px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #loginForm button:hover {
      background-color: #1565c0;
    }
    footer {
      position: fixed;
      bottom: 10px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>

  <!-- Login form -->
  <div id="loginForm">
    <h2>Led room miniproject Login</h2>
    <input type="email" id="email" placeholder="Enter Email" required />
    <input type="password" id="password" placeholder="Enter Password" required />
    <button id="loginBtn">Login</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <h1>LED Control</h1>
    <div class="LED-card">
      <h2>LED 1</h2>
      <div class="status off" id="status1">OFF</div>
      <button class="btn-off" id="btn1">Turn ON</button>
    </div>
    <button id="logoutBtn">Logout</button>
  </div>

  <footer>
    Created by Tech StudyCell
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyADo5wyzjDa4-EPrltkqKAl5XkaE61b2U0",
      authDomain: "miniproject0217-9d777.firebaseapp.com",
      databaseURL: "https://miniproject0217-9d777-default-rtdb.firebaseio.com",
      projectId: "miniproject0217-9d777",
      storageBucket: "miniproject0217-9d777.firebasestorage.app",
      messagingSenderId: "765735848587",
      appId: "1:765735848587:web:e90d2db268b662bee0628e"
    };

    firebase.initializeApp(firebaseConfig);

    // Predefined login credentials
    const allowedEmail = "fxnggorr2009@gmail.com";
    const allowedPassword = "miniproject0217";

    const loginForm = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");
    const loginBtn = document.getElementById("loginBtn");

    loginBtn.addEventListener("click", () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please enter email and password.");
        return;
      }

      // Check hardcoded credentials first
      if(email === allowedEmail && password === allowedPassword){
        // Sign in with Firebase
        firebase.auth().signInWithEmailAndPassword(email, password)
          .then(userCredential => {
            console.log("Signed in as", userCredential.user.email);
            loginForm.style.display = "none";
            dashboard.style.display = "flex";
            dashboard.style.flexDirection = "column";
            dashboard.style.alignItems = "center";
            startRelayControl();
          })
          .catch(error => {
            alert("Firebase login failed: " + error.message);
          });
      } else {
        alert("Invalid email or password.");
      }
    });

    function startRelayControl() {
      const db = firebase.database();
      const statusText = document.getElementById("status1");
      const toggleButton = document.getElementById("btn1");
      const relayRef = db.ref("/led1");

      // Listen for changes from Firebase
      relayRef.on("value", (snapshot) => {
        const state = snapshot.val();
        
        if (state) {
          // LED is ON
          statusText.innerText = "ON";
          statusText.className = "status on";
          toggleButton.innerText = "Turn OFF";
          toggleButton.className = "btn-on";
        } else {
          // LED is OFF
          statusText.innerText = "OFF";
          statusText.className = "status off";
          toggleButton.innerText = "Turn ON";
          toggleButton.className = "btn-off";
        }
      });

      // Toggle button click
      toggleButton.onclick = () => {
        relayRef.get().then(snap => {
          const currentState = snap.val();
          relayRef.set(!currentState);
        });
      };
    }

    document.getElementById("logoutBtn").onclick = () => {
      firebase.auth().signOut()
        .then(() => {
          dashboard.style.display = "none";
          loginForm.style.display = "block";
          document.getElementById("email").value = "";
          document.getElementById("password").value = "";
        })
        .catch(error => {
          alert("Logout failed: " + error.message);
        });
    };
  </script>
</body>
</html>
